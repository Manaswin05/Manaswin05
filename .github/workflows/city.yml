name: Build Coding City

on:
  schedule:
    - cron: "0 1 * * *" # Runs daily at 1 AM to avoid conflict with metrics action
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Generate City Skyline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generateCity.js

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add assets/city/skyline.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Coding City skyline [skip ci]"
            git push
          fi
